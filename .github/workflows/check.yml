name: Typecheck
on:
  pull_request:
  push:
    branches: [main, feat/sample-guided-audio-tour]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx expo install --check
      - run: npm run typecheck
      - name: Verify static website build
        run: npx expo export --platform web
